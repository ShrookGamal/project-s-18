<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدونة ديار الخبرة | مقالات المصاعد والسلالم والمشايات الكهربائية</title>
<meta name="description" content="مقالات ونصائح من ديار الخبرة حول تركيب وصيانة المصاعد والسلالم الكهربائية والمشايات المتحركة في مكة المكرمة والسعودية.">
<meta name="keywords" content="مصاعد مكة, تركيب مصاعد, صيانة مصاعد, سلالم كهربائية, مشايات متحركة, عقود صيانة مصاعد, مصاعد فلل, مصاعد بانورامية, ديار الخبرة">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0c192c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0c192c;
  --navy-2: #12243e;
  --grey: #767f83;
  --gold: #c6a878;
  --gold-2: #dec598;
  --brown: #6a1d08;
  --paper: #f6f3ec;
  --ink: #1a2638;
  --header-h: 68px;
  --ease: cubic-bezier(.22, .9, .3, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; overflow-x: hidden; scroll-padding-top: 90px; }

body {
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.9;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img { max-width: 100%; display: block; }

/* progress */
.progress {
  position: fixed;
  top: 0; right: 0;
  height: 4px;
  width: 0;
  z-index: 2000;
  background: linear-gradient(90deg, var(--brown), var(--gold), var(--gold-2));
  box-shadow: 0 0 12px rgba(198, 168, 120, .8);
}

/* header */
.bp-header {
  position: fixed;
  top: 0; right: 0; left: 0;
  z-index: 1500;
  height: var(--header-h);
  background: rgba(12, 25, 44, .88);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(198, 168, 120, .3);
  box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
}

.bp-header-inner {
  max-width: 1280px;
  height: 100%;
  margin: 0 auto;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: .88rem;
  font-weight: 800;
  color: var(--gold-2);
  border: 1.5px solid rgba(198, 168, 120, .65);
  border-radius: 999px;
  background: rgba(198, 168, 120, .08);
  white-space: nowrap;
  transition: background .35s, color .35s, transform .35s var(--ease);
}

.back-btn svg { transition: transform .35s var(--ease); }

.back-btn:hover {
  color: var(--navy);
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  transform: translateY(-2px);
}

.back-btn:hover svg { transform: translateX(5px); }

.bp-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bp-brand img {
  height: 40px;
  width: auto;
  max-width: 90px;
  object-fit: contain;
}

.bp-brand span {
  font-size: 1.3rem;
  font-weight: 900;
  background: linear-gradient(90deg, var(--gold-2), var(--gold), #fff, var(--gold));
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: shine 6s linear infinite;
  white-space: nowrap;
}

@keyframes shine { to { background-position: -250% 0; } }

/* hero */
.bp-hero {
  position: relative;
  padding: calc(var(--header-h) + 70px) 22px 90px;
  background: linear-gradient(160deg, var(--navy), var(--navy-2) 60%, var(--navy));
  color: #fff;
  overflow: hidden;
  isolation: isolate;
}

.hero-img {
  position: absolute;
  inset: 0;
  z-index: -3;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .28;
}

.bp-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(circle at 15% 20%, rgba(106, 29, 8, .6), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(198, 168, 120, .22), transparent 50%),
    linear-gradient(180deg, rgba(12, 25, 44, .55), rgba(12, 25, 44, .95));
}

.bp-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  opacity: .45;
  background-image:
    linear-gradient(rgba(198, 168, 120, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(198, 168, 120, .07) 1px, transparent 1px);
  background-size: 52px 52px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
}

.hero-inner { max-width: 900px; margin: 0 auto; text-align: center; }

.crumbs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  font-size: .85rem;
  color: rgba(255, 255, 255, .65);
}

.crumbs a:hover { color: var(--gold-2); }

.cat-chip {
  display: inline-block;
  padding: 6px 18px;
  margin-bottom: 18px;
  font-size: .85rem;
  font-weight: 800;
  color: var(--navy);
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  border-radius: 999px;
  box-shadow: 0 8px 22px rgba(198, 168, 120, .4);
}

.hero-title {
  font-size: clamp(1.7rem, 4.4vw, 3rem);
  font-weight: 900;
  line-height: 1.5;
  margin-bottom: 22px;
}

.hero-lead {
  max-width: 740px;
  margin: 0 auto 26px;
  font-size: 1.1rem;
  color: rgba(255, 255, 255, .82);
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.hero-meta span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  font-size: .85rem;
  color: rgba(255, 255, 255, .85);
  border: 1px solid rgba(118, 127, 131, .6);
  border-radius: 999px;
  background: rgba(118, 127, 131, .12);
}

.hero-meta svg { color: var(--gold); }

/* layout */
.bp-wrap {
  max-width: 1240px;
  margin: -40px auto 0;
  padding: 0 22px 70px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 34px;
  align-items: start;
  position: relative;
  z-index: 2;
}

.article {
  background: #fff;
  border-radius: 28px;
  padding: 48px 52px 40px;
  border: 1px solid rgba(198, 168, 120, .35);
  box-shadow: 0 30px 70px rgba(12, 25, 44, .14);
}

/* takeaways */
.takeaways {
  position: relative;
  margin-bottom: 40px;
  padding: 26px 28px;
  color: #fff;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  border-radius: 22px;
  border-right: 6px solid var(--gold);
  overflow: hidden;
}

.takeaways::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -6%;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(198, 168, 120, .3), transparent 70%);
}

.takeaways h2 {
  position: relative;
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--gold-2);
  margin-bottom: 12px;
}

.takeaways ul { position: relative; display: grid; gap: 8px; }

.takeaways li {
  position: relative;
  padding-right: 28px;
  font-size: .98rem;
  color: rgba(255, 255, 255, .88);
}

.takeaways li::before {
  content: "";
  position: absolute;
  top: 12px;
  right: 4px;
  width: 9px;
  height: 9px;
  background: var(--gold);
  transform: rotate(45deg);
}

/* content */
.sec { margin-bottom: 44px; }

.sec h2 {
  position: relative;
  font-size: clamp(1.4rem, 2.8vw, 1.9rem);
  font-weight: 900;
  line-height: 1.6;
  color: var(--navy);
  margin-bottom: 18px;
  padding-right: 22px;
}

.sec h2::before {
  content: "";
  position: absolute;
  top: 8px;
  right: 0;
  width: 7px;
  height: calc(100% - 16px);
  min-height: 26px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--gold), var(--brown));
}

.sec h3 {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--brown);
  margin: 22px 0 10px;
}

.sec p {
  font-size: 1.05rem;
  color: rgba(26, 38, 56, .88);
  margin-bottom: 16px;
}

.sec b { color: var(--navy); font-weight: 800; }

.sec ul.bul { display: grid; gap: 12px; margin: 6px 0 20px; }

.sec ul.bul li {
  position: relative;
  padding: 14px 52px 14px 16px;
  font-size: 1.02rem;
  background: #faf7f1;
  border: 1px solid rgba(198, 168, 120, .35);
  border-radius: 16px;
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s;
}

.sec ul.bul li::before {
  content: "";
  position: absolute;
  top: 22px;
  right: 22px;
  width: 11px;
  height: 11px;
  background: linear-gradient(135deg, var(--gold), var(--brown));
  transform: rotate(45deg);
}

.sec ul.bul li:hover {
  transform: translateX(-6px);
  border-color: var(--gold);
  box-shadow: 0 12px 28px rgba(198, 168, 120, .3);
}

.sec ol.steps { counter-reset: st; display: grid; gap: 12px; margin: 6px 0 20px; }

.sec ol.steps li {
  counter-increment: st;
  position: relative;
  min-height: 56px;
  padding: 14px 70px 14px 16px;
  font-size: 1.02rem;
  background: #fff;
  border: 1px solid rgba(118, 127, 131, .3);
  border-radius: 16px;
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}

.sec ol.steps li::before {
  content: counter(st);
  position: absolute;
  top: 50%;
  right: 14px;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  font-weight: 900;
  color: var(--navy);
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  border-radius: 12px;
  box-shadow: 0 8px 18px rgba(198, 168, 120, .45);
}

.sec ol.steps li:hover {
  transform: translateX(-6px);
  box-shadow: 0 12px 28px rgba(12, 25, 44, .12);
}

.note {
  position: relative;
  margin: 8px 0 22px;
  padding: 20px 24px 20px 20px;
  padding-right: 64px;
  font-size: 1.02rem;
  color: var(--navy);
  background: linear-gradient(135deg, rgba(198, 168, 120, .22), rgba(198, 168, 120, .08));
  border: 1px solid rgba(198, 168, 120, .6);
  border-radius: 18px;
}

.note::before {
  content: "!";
  position: absolute;
  top: 18px;
  right: 18px;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  font-weight: 900;
  color: #fff;
  background: var(--brown);
  border-radius: 50%;
}

.tbl-wrap {
  overflow-x: auto;
  margin: 8px 0 24px;
  border-radius: 18px;
  border: 1px solid rgba(12, 25, 44, .15);
  box-shadow: 0 14px 34px rgba(12, 25, 44, .08);
}

table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .96rem; }

thead th {
  padding: 14px 16px;
  text-align: right;
  font-weight: 800;
  color: var(--gold-2);
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
}

tbody td {
  padding: 13px 16px;
  border-top: 1px solid rgba(12, 25, 44, .08);
  color: rgba(26, 38, 56, .9);
}

tbody tr:nth-child(even) { background: #faf7f1; }
tbody tr:hover { background: rgba(198, 168, 120, .18); }
tbody td:first-child { font-weight: 800; color: var(--navy); }

figure.pic { margin: 10px 0 26px; }

.pic-box {
  position: relative;
  aspect-ratio: 16 / 8;
  border-radius: 22px;
  overflow: hidden;
  background: var(--navy);
  border: 2px solid var(--gold);
  box-shadow: 0 22px 46px rgba(12, 25, 44, .22);
}

.pic-box img { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: cover; }

.pic-fb {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  padding: 20px;
  text-align: center;
  font-weight: 700;
  font-size: .9rem;
  color: rgba(198, 168, 120, .8);
  background:
    repeating-linear-gradient(45deg, rgba(198, 168, 120, .06) 0 12px, transparent 12px 24px),
    linear-gradient(135deg, var(--navy-2), var(--navy));
}

figure.pic figcaption { margin-top: 10px; text-align: center; font-size: .88rem; color: var(--grey); }

/* faq */
.faq { margin-top: 10px; }

.faq h2 { margin-bottom: 20px; }

.faq details {
  margin-bottom: 12px;
  background: #fff;
  border: 1px solid rgba(118, 127, 131, .35);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color .3s, box-shadow .3s;
}

.faq details[open] {
  border-color: var(--gold);
  box-shadow: 0 14px 32px rgba(198, 168, 120, .3);
}

.faq summary {
  position: relative;
  list-style: none;
  cursor: pointer;
  padding: 16px 56px 16px 18px;
  font-size: 1.04rem;
  font-weight: 800;
  color: var(--navy);
}

.faq summary::-webkit-details-marker { display: none; }

.faq summary::before {
  content: "+";
  position: absolute;
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--navy);
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  border-radius: 8px;
  transition: transform .35s var(--ease);
}

.faq details[open] summary::before { content: "−"; transform: translateY(-50%) rotate(180deg); }

.faq details p { padding: 0 18px 18px; margin: 0; font-size: 1rem; color: rgba(26, 38, 56, .85); }

/* aside */
.aside { position: sticky; top: calc(var(--header-h) + 22px); display: grid; gap: 20px; }

.toc, .aside-cta {
  border-radius: 22px;
  padding: 22px;
  border: 1px solid rgba(198, 168, 120, .4);
  box-shadow: 0 20px 46px rgba(12, 25, 44, .12);
}

.toc { background: #fff; max-height: calc(100vh - 260px); overflow-y: auto; }

.toc h3 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  font-size: 1.05rem;
  font-weight: 900;
  color: var(--navy);
}

.toc h3::after {
  content: "";
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.toc ol { display: grid; gap: 4px; }

.toc a {
  display: block;
  padding: 8px 12px;
  font-size: .9rem;
  font-weight: 700;
  line-height: 1.6;
  color: rgba(26, 38, 56, .75);
  border-right: 3px solid transparent;
  border-radius: 8px;
  transition: background .3s, color .3s, border-color .3s;
}

.toc a:hover { background: rgba(198, 168, 120, .15); color: var(--navy); }

.toc a.on {
  color: var(--navy);
  background: rgba(198, 168, 120, .25);
  border-right-color: var(--brown);
}

.aside-cta {
  text-align: center;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), #8a2a10);
}

.aside-cta h3 { font-size: 1.1rem; font-weight: 900; margin-bottom: 6px; }
.aside-cta p { font-size: .9rem; margin-bottom: 14px; color: rgba(255, 255, 255, .85); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 20px;
  font-family: inherit;
  font-size: .98rem;
  font-weight: 800;
  border-radius: 14px;
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}

.btn + .btn { margin-top: 10px; }
.btn:hover { transform: translateY(-3px); }

.btn-gold {
  color: var(--navy);
  background: linear-gradient(135deg, var(--gold-2), var(--gold) 60%, #b48f55);
  box-shadow: 0 10px 26px rgba(198, 168, 120, .45);
}

.btn-line { color: #fff; border: 1.5px solid rgba(255, 255, 255, .6); }
.btn-line:hover { background: rgba(255, 255, 255, .12); }

/* bottom cta */
.bottom-cta {
  position: relative;
  margin-top: 10px;
  padding: 34px 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 22px;
  color: #fff;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  border: 1px solid rgba(198, 168, 120, .6);
  border-radius: 24px;
  overflow: hidden;
}

.bottom-cta::before {
  content: "";
  position: absolute;
  top: -60%;
  left: -6%;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(198, 168, 120, .3), transparent 70%);
}

.bottom-cta > div { position: relative; }
.bottom-cta h3 { font-size: 1.4rem; font-weight: 900; margin-bottom: 4px; color: var(--gold-2); }
.bottom-cta p { color: rgba(255, 255, 255, .8); max-width: 520px; margin: 0; font-size: 1rem; }
.bottom-cta .acts { display: flex; flex-wrap: wrap; gap: 10px; }
.bottom-cta .btn { width: auto; min-width: 150px; margin: 0; }

/* related */
.related { max-width: 1240px; margin: 0 auto; padding: 0 22px 90px; }

.related h2 {
  font-size: clamp(1.4rem, 3vw, 2rem);
  font-weight: 900;
  color: var(--navy);
  margin-bottom: 24px;
  text-align: center;
}

.related h2 em {
  font-style: normal;
  background: linear-gradient(90deg, var(--brown), var(--gold), var(--brown));
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: shine 6s linear infinite;
}

.rel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }

.rel-card {
  display: block;
  padding: 26px;
  background: #fff;
  border: 1px solid rgba(198, 168, 120, .4);
  border-radius: 22px;
  box-shadow: 0 16px 40px rgba(12, 25, 44, .08);
  transition: transform .45s var(--ease), box-shadow .45s var(--ease), border-color .4s;
}

.rel-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: 0 26px 56px rgba(198, 168, 120, .35); }

.rel-card small {
  display: inline-block;
  padding: 4px 14px;
  margin-bottom: 12px;
  font-size: .78rem;
  font-weight: 800;
  color: var(--brown);
  background: rgba(198, 168, 120, .22);
  border-radius: 999px;
}

.rel-card h3 { font-size: 1.15rem; font-weight: 900; line-height: 1.7; color: var(--navy); margin-bottom: 10px; }
.rel-card p { font-size: .95rem; color: rgba(26, 38, 56, .72); margin-bottom: 14px; }
.rel-card span { font-weight: 800; color: var(--brown); }

/* footer */
.bp-footer {
  padding: 26px 22px;
  text-align: center;
  font-size: .9rem;
  color: rgba(255, 255, 255, .7);
  background: var(--navy);
  border-top: 3px solid var(--gold);
}

.bp-footer a { color: var(--gold-2); font-weight: 800; }

/* reveal */
.rv { opacity: 0; transform: translateY(34px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.rv.in { opacity: 1; transform: none; }

/* responsive */
@media (max-width: 1024px) {
  .bp-wrap { grid-template-columns: 1fr; margin-top: -30px; }
  .aside { position: static; order: -1; }
  .toc { max-height: none; }
  .aside-cta { display: none; }
}

@media (max-width: 640px) {
  :root { --header-h: 62px; }
  .bp-header-inner { padding: 0 14px; }
  .back-btn { padding: 7px 12px; font-size: .8rem; }
  .bp-brand img { height: 34px; }
  .bp-brand span { font-size: 1.1rem; }
  .bp-hero { padding: calc(var(--header-h) + 46px) 18px 76px; }
  .bp-wrap { padding: 0 14px 54px; gap: 22px; }
  .article { padding: 28px 18px 26px; border-radius: 22px; }
  .sec ul.bul li { padding: 13px 46px 13px 14px; }
  .sec ul.bul li::before { right: 18px; }
  .sec ol.steps li { padding: 13px 64px 13px 14px; }
  .rel-grid { grid-template-columns: 1fr; }
  .related { padding: 0 14px 64px; }
  .bottom-cta { padding: 26px 20px; text-align: center; justify-content: center; }
  .bottom-cta .acts { width: 100%; justify-content: center; }
  .bottom-cta .btn { width: 100%; }
}
